name: QT-83 cross-repository dispatch source
on:
  workflow_dispatch:
permissions: {}
jobs:
  attempt-dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Try to dispatch a workflow in the second owned test repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            https://api.github.com/repos/UnoxyRich/actions-token-boundary-lab/actions/workflows/qt83-target.yml/dispatches)
          echo "cross_repo_dispatch_http_status=${status}"
